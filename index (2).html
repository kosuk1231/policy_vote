const SB_HEADERS=()=>({"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"});
async function sbGet(path){ const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+path,{headers:SB_HEADERS()}); if(!r.ok) throw new Error("Supabase "+r.status); return r.json(); }
async function sbRpc(fn,params){ try{ const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:SB_HEADERS(),body:JSON.stringify(params)}); const d=await r.json().catch(()=>null); if(!r.ok) return {ok:false,error:(d&&d.message)||("요청 실패 "+r.status)}; return d||{ok:false,error:"응답이 없습니다."}; }catch(e){ return {ok:false,error:"네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요."}; } }
async function gasCall(doFetch){ let last; for(let i=0;i<3;i++){ try{ const r=await doFetch(); const t=await r.text(); try{ return JSON.parse(t); }catch(e){ last=e; } }catch(e){ last=e; } await new Promise(res=>setTimeout(res,700*(i+1)+Math.random()*500)); } return {ok:false,error:BUSY_MSG,_busy:true}; }
async function apiGet(action){ if(DEMO) return mockApi(action,{}); return gasCall(()=>fetch(CONFIG.GAS_URL+"?action="+encodeURIComponent(action))); }
async function apiPost(payload){ if(DEMO) return mockApi(payload.action,payload); return gasCall(()=>fetch(CONFIG.GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})); }

}

  if(route==="vote") return viewVote(view);
  if(route==="judge") return viewJudge(view);
  if(route==="admin") return viewAdmin(view);

}

let LIST_FILTER={field:"",sub:"",q:""};
async function viewList(view){
  view.innerHTML=`<div class="skeleton"><span class="spin"></span> 공개 목록을 불러오는 중…</div>`;
  if(!STATE.list){ const r=await apiGet("list"); if(!r.ok){ view.innerHTML=`<div class="card"><div class="err">${esc(r.error||BUSY_MSG)}</div><button class="btn ghost sm" onclick="viewList($('#view'))">다시 시도</button></div>`; return; } STATE.list=r.items||[]; }
  renderList(view);
}
function renderList(view){
  const all=STATE.list, f=LIST_FILTER;
  const items=all.filter(it=>(!f.field||it.제안분야===f.field)&&(!f.sub||it.세부분야===f.sub)&&(!f.q||(it.제안명+" "+it.한줄요약).toLowerCase().includes(f.q.toLowerCase())));
  view.innerHTML=`<div class="eyebrow">공개 목록</div><h1 class="morph" data-from="440" data-to="760" style="font-size:clamp(30px,4vw,44px)">접수된 <b>정책제안</b></h1>
    <p class="lead" style="margin-top:12px">제안자 정보는 공개하지 않습니다. 제목을 누르면 현황·제안 내용·기대효과를 볼 수 있습니다.</p>
    <div class="toolbar" style="margin:18px 0 0;align-items:flex-end">
      <div class="tabs" style="margin:0">${["",...FIELDS].map(v=>`<button class="${f.field===v?'on':''}" onclick="setFilter('field','${esc(v)}')">${v||"전체"}</button>`).join("")}</div>
      <span class="spacer"></span><div class="search"><input placeholder="제안명·요약 검색" value="${esc(f.q)}" oninput="LIST_FILTER.q=this.value;renderList($('#view'));this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>
    </div>
    ${f.field==="처우개선"?`<div class="tabs">${["",...SUBFIELDS["처우개선"]].map(v=>`<button class="${f.sub===v?'on':''}" onclick="setFilter('sub','${esc(v)}')">${v||"세부 전체"}</button>`).join("")}</div>`:""}
    <div class="counter" style="margin:14px 0 2px">${items.length}건 / 전체 ${all.length}건</div>
    ${items.length?items.map(it=>`<div class="row" onclick="openDetail('${esc(it.신청ID)}')">
        <div><div class="meta"><span class="chip">${esc(it.제안분야)}</span>${it.세부분야?`<span class="chip sub">${esc(it.세부분야)}</span>`:""}</div><h3>${esc(it.제안명)}</h3><p class="sum">${esc(it.한줄요약)}</p></div>

  window.dispatchEvent(new Event("scroll"));
}
function setFilter(k,v){ LIST_FILTER[k]=v; if(k==="field") LIST_FILTER.sub=""; renderList($("#view")); }
function openDetail(id){

function restoreDraft(){

function showDraftBar(ts){ const b=$("#draftBar"); if(!b) return; b.innerHTML=ts?`임시저장됨 · ${new Date(ts).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} <a onclick="clearDraft()">임시저장 삭제</a>`:`작성 중인 내용은 이 기기에 자동 임시저장됩니다.`; }

function validateApply(d){
  const miss=[], mark=k=>{ const w=document.querySelector(`.f[data-k="${k}"]`)||$("#row_"+k); if(w) w.classList.add("bad"); miss.push(LABEL[k]||k); };

  PROPOSAL.forEach(([k,type,req])=>{ if(type==="field"&&!d.제안분야) mark("제안분야"); else if(type==="subfield"){ if(d.제안분야&&SUBFIELDS[d.제안분야]&&!d.세부분야) mark("세부분야"); } else if(req&&type!=="file"&&!String(d[k]).trim()) mark(k); });

    case "exportData": { const H=["신청ID","제안명","제안분야","세부분야","한줄요약","성명","소속기관","현황및문제점","제안내용","기대효과"]; const vs=demoVoteStats(); return {ok:true,제안내역:[H].concat(D.items.map(it=>H.map(h=>it[h]||""))),심사집계:[["신청ID","제안명","위원회점수(평균/50)"]].concat(D.items.map(it=>{const s=Object.values(D.scores[it.신청ID]||{}).map(x=>x.합계);return [it.신청ID,it.제안명,s.length?s.reduce((a,c)=>a+c,0)/s.length:""]})),투표집계:[["신청ID","득표수"]].concat(D.finalists.map(id=>[id,vs.counts[id]||0]))}; }
    case "setFinalists": D.finalists=b.ids||[]; return {ok:true};
    case "setStage": D.stage=b.stage; return {ok:true,stage:b.stage};
    case "setConfig": { if(b.행사명) D.name=b.행사명; if(b.본선개수) D.N=parseInt(b.본선개수,10)||D.N; if(b.투표선택수) D.K=parseInt(b.투표선택수,10)||D.K; if(b.투표자격) D.Q=b.투표자격; D.finalists=D.items.slice().sort((a,c)=>c._base-a._base).slice(0,D.N).map(i=>i.신청ID); return {ok:true,msg:"설정 저장 완료(데모)"}; }
    case "setVisibility": { const it=D.items.find(i=>i.신청ID===b.appId); if(it) it.공개=!!b.visible; return {ok:true}; }
    case "syncSupabase": case "importVotes": return {ok:false,error:"미리보기 모드에서는 사용할 수 없습니다."};
    case "ballot": return {ok:true,items:D.stage!=="투표"?[]:D.finalists.map(id=>D.items.find(i=>i.신청ID===id)).filter(Boolean)};
    case "results": return {ok:true,results:demoResults()};
    case "verifyMember": { const n=String(b.name||"").replace(/\s/g,""), bd=String(b.birth||""); if(!n||bd.length!==6) return {ok:false,error:"성함과 생년월일 6자리를 정확히 입력해 주세요."}; if(D.Q==="회원명단"&&!D.members.some(m=>m[0]===n&&m[1]===bd)) return {ok:false,error:"회비납부 회원 명단에서 확인되지 않습니다. (데모: 김서울/850312)"}; if(D.votes.some(v=>v.성명===n&&v.생년월일===bd)) return {ok:false,error:"이미 투표에 참여하셨습니다."}; return {ok:true}; }
    case "submitVote": { const v=await mockApi("verifyMember",b); if(!v.ok) return v; const ids=[...new Set(b.appIds||[])]; if(ids.length!==D.K) return {ok:false,error:`서로 다른 제안 ${D.K}건을 선택해 주세요.`}; ids.forEach(id=>D.votes.push({성명:String(b.name).replace(/\s/g,""),생년월일:b.birth,신청ID:id})); return {ok:true}; }
    default: return {ok:false,error:"알 수 없는 요청"};
  }
}
