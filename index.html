  .motion{position:relative;width:100%;min-height:200px;display:grid;place-items:center;padding:28px 24px 40px}
  .mline{position:absolute;left:24px;right:24px;text-align:center;font-family:var(--display);font-size:clamp(21px,2.4vw,30px);line-height:1.45;letter-spacing:-.02em;font-variation-settings:"wght" 480;color:var(--ism-color-foreground);opacity:0;animation:mcycle 9s var(--ism-motion-easing) infinite;animation-delay:var(--d,0s)}
  .mline .key{display:inline-block;font-variation-settings:"wght" 480;color:var(--ism-color-foreground);background:linear-gradient(var(--ism-color-4),var(--ism-color-4)) no-repeat 0 100%/0% 38%;animation:mkey 9s var(--ism-motion-easing) infinite;animation-delay:var(--d,0s);padding:0 2px}
  @keyframes mcycle{0%{opacity:0;transform:translateY(14px)}6%{opacity:1;transform:translateY(0)}44%{opacity:1;transform:translateY(0)}50%{opacity:0;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-10px)}}
  @keyframes mkey{0%,10%{font-variation-settings:"wght" 480;color:var(--ism-color-foreground);background-size:0% 38%}22%{font-variation-settings:"wght" 900;color:var(--ism-color-accent);background-size:100% 38%}44%{font-variation-settings:"wght" 900;color:var(--ism-color-accent);background-size:100% 38%}50%,100%{font-variation-settings:"wght" 480;color:var(--ism-color-foreground);background-size:0% 38%}}

async function gasCall(doFetch){ let last; for(let i=0;i<3;i++){ try{ const r=await doFetch(); const t=await r.text(); try{ return JSON.parse(t); }catch(e){ last=e; } }catch(e){ last=e; } await new Promise(res=>setTimeout(res,700*(i+1)+Math.random()*500)); } return {ok:false,error:BUSY_MSG,_busy:true}; }

function bindApply(){

let draftTimer=null; function saveDraftDebounced(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,500); }
function collectApply(){

function restoreDraft(){

function validateApply(d){
  const miss=[], mark=k=>{ const w=document.querySelector(`.f[data-k="${k}"]`)||$("#row_"+k); if(w) w.classList.add("bad"); miss.push(LABEL[k]||k); };

  if(d.생년월일.trim()&&d.생년월일.replace(/\D/g,"").length!==6){ const w=document.querySelector('.f[data-k="생년월일"]'); if(w) w.classList.add("bad"); miss.push("생년월일(6자리)"); }
  PROPOSAL.forEach(([k,type,req])=>{ if(type==="field"&&!d.제안분야) mark("제안분야"); else if(type==="subfield"){ if(d.제안분야&&SUBFIELDS[d.제안분야]&&!d.세부분야) mark("세부분야"); } else if(req&&type!=="file"&&!String(d[k]).trim()) mark(k); });

    case "setFinalists": D.finalists=b.ids||[]; return {ok:true};
    case "setStage": D.stage=b.stage; return {ok:true,stage:b.stage};
    case "setConfig": { if(b.행사명) D.name=b.행사명; if(b.본선개수) D.N=parseInt(b.본선개수,10)||D.N; if(b.투표선택수) D.K=parseInt(b.투표선택수,10)||D.K; if(b.투표자격) D.Q=b.투표자격; D.finalists=D.items.slice().sort((a,c)=>c._base-a._base).slice(0,D.N).map(i=>i.신청ID); return {ok:true,msg:"설정 저장 완료(데모)"}; }
    case "setVisibility": { const it=D.items.find(i=>i.신청ID===b.appId); if(it) it.공개=!!b.visible; return {ok:true}; }
    case "syncSupabase": case "importVotes": return {ok:false,error:"미리보기 모드에서는 사용할 수 없습니다."};
    case "ballot": return {ok:true,items:(D.stage!=="투표"&&D.stage!=="체험")?[]:D.finalists.map(id=>D.items.find(i=>i.신청ID===id)).filter(Boolean)};
    case "results": return {ok:true,results:demoResults()};
    case "verifyMember": { const n=String(b.name||"").replace(/\s/g,""), bd=String(b.birth||""); if(!n||bd.length!==6) return {ok:false,error:"성함과 생년월일 6자리를 정확히 입력해 주세요."}; if(D.Q==="누구나"&&D.votes.some(v=>v.성명===n)) return {ok:false,error:"이미 투표에 참여하셨습니다."}; if(D.Q==="회원명단"&&!D.members.some(m=>m[0]===n&&m[1]===bd)) return {ok:false,error:"회비납부 회원 명단에서 확인되지 않습니다. (데모: 김서울/850312)"}; if(D.votes.some(v=>v.성명===n&&v.생년월일===bd)) return {ok:false,error:"이미 투표에 참여하셨습니다."}; return {ok:true}; }
    case "submitVote": { const v=await mockApi("verifyMember",b); if(!v.ok) return v; const ids=[...new Set(b.appIds||[])]; if(ids.length!==D.K) return {ok:false,error:`서로 다른 제안 ${D.K}건을 선택해 주세요.`}; ids.forEach(id=>D.votes.push({성명:String(b.name).replace(/\s/g,""),생년월일:b.birth,신청ID:id})); return {ok:true}; }
    default: return {ok:false,error:"알 수 없는 요청"};
  }
}
